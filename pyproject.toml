[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koshur"
version = "1.1.0"
description = "A Comprehensive Computational Linguistics & Preservation Toolkit for the Kashmiri Language (कॉशुर / کٲشُر / 𑆯𑆳𑆫𑆢𑆳) and Regional Dialects"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Koshur Preservation Initiative"}
]
keywords = [
    "kashmiri",
    "koshur",
    "sharada",
    "kashmir",
    "dardic",
    "nlp",
    "linguistics",
    "language-preservation",
    "transliterator",
    "jammu-and-kashmir",
    "land-records",
    "jamabandi",
    "kishtwari",
    "poguli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/analytics-hub-new26/koshur-language-library"
"Bug Tracker" = "https://github.com/analytics-hub-new26/koshur-language-library/issues"
"Documentation" = "https://github.com/analytics-hub-new26/koshur-language-library#readme"

[project.scripts]
koshur = "koshur.cli:main"
